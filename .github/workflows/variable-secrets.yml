name: Exploring variables and secrets

on: push

env:
 CONTAINER_REGISTRY: docker.io
 DOCKER_USERNAME: pavan401
 IMAGE_NAME: github-actions-nginx

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker Build
        env:
          DOCKER_PASSWORD: Pavan@401
        run: docker build -t ${{ env.CONTAINER_REGISTRY }}/$DOCKER_USERNAME/$IMAGE_NAME:latest

      - name: Docker Login
        run: docker login --username=dockerUsername --password=$DOCKER_PASSWORD

      - name: Docker Publish
        run: docker build -t ${{ env.CONTAINER_REGISTRY }}/$DOCKER_USERNAME/$IMAGE_NAME:latest


  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Docker run
        run: docker run -d -p 8080:80 docker build -t ${{ env.CONTAINER_REGISTRY }}/$DOCKER_USERNAME/$IMAGE_NAME:latest
